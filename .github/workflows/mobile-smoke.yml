name: Test Android app launch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mobile-smoke.yml', 'mobile/scripts/smoke-android.mjs']
  workflow_run:
    workflows: ['Build mobile apps']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find successful native build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const {data}=await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'mobile-build.yml',branch:'main',status:'success',per_page:1});
            if(!data.workflow_runs.length)throw new Error('No successful native build');
            core.setOutput('id',data.workflow_runs[0].id);
      - uses: actions/download-artifact@v4
        with:
          name: family-news-android-apk
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.id }}
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open bundled app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node mobile/scripts/smoke-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-launch-evidence
          path: smoke-evidence
          retention-days: 7
