name: Build native SwiftUI iOS
on:
  push:
    branches: [main]
    paths: ['native-ios/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-native-ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify native logic and security boundaries
        run: |
          python3 native-ios/checks/core-checks.py
          python3 native-ios/checks/biometric-checks.py
          python3 native-ios/checks/icon-checks.py
          python3 native-ios/checks/subscription-checks.py
      - name: Build native device archive
        run: |
          set -o pipefail
          xcodebuild -project native-ios/FamilyNews.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath native-build/FamilyNews.xcarchive CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee native-build.log
      - name: Verify compiled alternate icon metadata
        run: |
          python3 - <<'PYICON'
          import plistlib
          from pathlib import Path
          app=Path('native-build/FamilyNews.xcarchive/Products/Applications/App.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert 'Family01' in info['CFBundleIcons']['CFBundleAlternateIcons']
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName']=='AppIcon'
          print('PASS: archive includes primary platform icon and Family01 alternate icon')
          PYICON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-news-native-build-log
          path: native-build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: family-news-native-ios
          path: |
            native-ios
            native-build/FamilyNews.xcarchive
          retention-days: 7
