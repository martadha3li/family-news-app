name: Build mobile apps
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'dist/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-news-mobile
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: mobile
      - run: npm run prepare:web && npm run check && npx cap add android
        working-directory: mobile
      - run: python -m pip install Pillow==11.3.0
      - run: python mobile/scripts/customize-platforms.py
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: family-news-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: npm run prepare:web && npm run check && npx cap add ios
        working-directory: mobile
      - run: python3 -m pip install --user --break-system-packages Pillow==11.3.0
      - run: python3 mobile/scripts/customize-platforms.py
      - name: Archive without distribution signature
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/FamilyNews.xcarchive CODE_SIGNING_ALLOWED=NO archive
        working-directory: mobile/ios/App
      - uses: actions/upload-artifact@v4
        with:
          name: family-news-ios-unsigned-project
          path: |
            mobile/ios
            mobile/capacitor.config.json
            mobile/README.md
          retention-days: 7
