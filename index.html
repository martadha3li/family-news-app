<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f48"><title>أخبار العائلة</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#f3f6f5;font:16px system-ui;color:#173b37}header{background:#17574f;color:white;padding:18px;text-align:center;font-weight:700}main{max-width:660px;margin:24px auto;padding:0 14px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #1232}input,textarea,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #cad7d4;margin:7px 0;font:inherit}button{background:#17574f;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}.muted{color:#64736f;font-size:13px}.hidden{display:none}img{max-width:100%;border-radius:12px}.actions{display:flex;gap:8px}.actions button{flex:1}h2{margin-top:0}</style></head><body><header>🌿 أخبار العائلة</header><main><section id="auth" class="card"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><button id="signup">إنشاء حساب عضو</button><p id="authmsg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><div class="actions"><strong id="welcome"></strong><button id="logout">خروج</button></div></div><section id="editor" class="card hidden"><h2>📰 نشر خبر</h2><input id="title" maxlength="250" placeholder="عنوان الخبر"><textarea id="body" placeholder="نص الخبر"></textarea><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="publish">نشر الخبر</button></section><div id="feed"></div></section></main><script type="module">
import{createClient}from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://dlkykiducjimwehfhxfq.supabase.co','sb_publishable_em1zUQS1tUhfk_8Ji17n8g_H8CPQynt');const $=id=>document.getElementById(id);let user,role='member';
const msg=(s)=>$('authmsg').textContent=s;const err=e=>alert(e?.message||String(e));const safe=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
async function refresh(){const{data:{user:u}}=await db.auth.getUser();user=u;$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(!u)return;let{data:p}=await db.from('profiles').select('role,display_name').eq('id',u.id).maybeSingle();if(!p){await db.from('profiles').insert({id:u.id,display_name:u.email?.split('@')[0]||'عضو'});const r=await db.from('profiles').select('role,display_name').eq('id',u.id).maybeSingle();p=r.data}role=p?.role||'member';$('welcome').textContent='مرحباً '+(p?.display_name||u.email)+' · '+({admin:'مدير',journalist:'صحفي',member:'عضو'}[role]);$('editor').classList.toggle('hidden',!['admin','journalist'].includes(role));await feed()}
$('login').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else refresh()};
$('signup').onclick=async()=>{const{error}=await db.auth.signUp({email:$('email').value,password:$('password').value});msg(error?error.message:'تم إرسال طلب التسجيل. تحقق من بريدك إذا كان التأكيد مطلوباً.')};
$('logout').onclick=async()=>{await db.auth.signOut();refresh()};
$('publish').onclick=async()=>{const title=$('title').value.trim(),body=$('body').value.trim(),file=$('photo').files[0];if(title.length<3||!body)return alert('أدخل العنوان والخبر');let image_path=null;if(file){if(file.size>5242880)return alert('الصورة أكبر من 5 ميجابايت');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';image_path=user.id+'/'+crypto.randomUUID()+'.'+ext;const{error}=await db.storage.from('news-images').upload(image_path,file,{contentType:file.type});if(error)return err(error)}const{error}=await db.from('posts').insert({title,body,image_path,author_id:user.id,published:true});if(error)return err(error);$('title').value='';$('body').value='';$('photo').value='';await feed()};
async function feed(){const{data:posts,error}=await db.from('posts').select('id,title,body,image_path,created_at,author_id').eq('published',true).order('created_at',{ascending:false}).limit(50);if(error)return err(error);const box=$('feed');box.replaceChildren();for(const p of posts||[]){const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+safe(p.title)+'</h2><p class="muted">'+new Date(p.created_at).toLocaleString('ar-SA')+'</p><p>'+safe(p.body).replaceAll('\n','<br>')+'</p>';if(p.image_path){const{data}=await db.storage.from('news-images').createSignedUrl(p.image_path,3600);if(data?.signedUrl){const img=document.createElement('img');img.src=data.signedUrl;img.alt='صورة الخبر';card.append(img)}}const actions=document.createElement('div');actions.className='actions';const like=document.createElement('button');like.textContent='♡ إعجاب';like.onclick=async()=>{const{error}=await db.from('likes').upsert({post_id:p.id,user_id:user.id});if(error)err(error);else like.textContent='♥ أعجبني'};actions.append(like);card.append(actions);const comments=document.createElement('div');card.append(comments);const{data:cs}=await db.from('comments').select('id,body,author_id').eq('post_id',p.id).order('created_at',{ascending:true}).limit(100);for(const c of cs||[]){const line=document.createElement('p');line.textContent='💬 '+c.body;comments.append(line)}const input=document.createElement('input');input.placeholder='أضف تعليقاً';const send=document.createElement('button');send.textContent='إرسال تعليق';send.onclick=async()=>{if(!input.value.trim())return;const{error}=await db.from('comments').insert({post_id:p.id,author_id:user.id,body:input.value.trim()});if(error)err(error);else feed()};card.append(input,send);box.append(card)}}
db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
</script></body></html>
